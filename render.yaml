services:
  - type: web
    name: ai-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    aptPackages:
      - ffmpeg
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12.8"

  - type: web
    name: backend
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        value: "https://ai-service.onrender.com"

  - type: web
    name: frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://backend.onrender.com"
      - key: VITE_SOCKET_URL
        value: "https://backend.onrender.com"