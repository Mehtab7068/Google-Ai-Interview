services:
  - type: web
    name: ai-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    aptPackages:
      - ffmpeg
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_PORT
        value: 8000